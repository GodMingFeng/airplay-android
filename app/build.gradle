plugins {
    id 'com.android.application'
}

// Release signing is driven by keystore.properties, which stays out of version control
// along with the keystore itself. Without that file the release build falls back to the
// debug key, so a fresh clone still produces an installable APK.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def useReleaseKeystore = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (useReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.airplay.android'
    compileSdk 33

    signingConfigs {
        if (useReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.airplay.android"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig useReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES',
                         'META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties',
                         'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'

    // java-airplay-lib dependencies
    implementation 'org.jmdns:jmdns:3.5.7'
    implementation 'net.i2p.crypto:eddsa:0.3.0'
    implementation 'org.whispersystems:curve25519-java:0.5.0'
    implementation 'com.googlecode.plist:dd-plist:1.23'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.slf4j:slf4j-simple:1.7.36'

    // Netty for RTSP server
    implementation 'io.netty:netty-all:4.1.94.Final'
}
